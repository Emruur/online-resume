profile:
    display: true
    title: Profile
    details: |
      Computer scientist with a Master's in Artificial Intelligence and a Bachelor's in Computer Science, focused on large language models. My thesis (DeltaAttention) covers sparse attention for long-context optimization, with custom CUDA/Triton kernels. I've also surveyed the literature on LLM interpretability in a blogpost (FeatureCircuits). At Commit Global, I built SmartQA, a full-stack information-retrieval pipeline powering a lightweight, hallucination-resistant chatbot.

      Outside of LLMs I enjoy applying ML to creative problems, such as an evolutionary brush-generation system (CreativeBrushes) and a genetic-algorithm settlement generator for Minecraft.

      Open to AI/ML roles.
